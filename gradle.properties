# Project metadata expected to vary between repositories.
# Gradle applies `group` and `version` to the project automatically.
group = dev.petrus.everylibs
version = 1.0.0

# Repository URL used by the Gradle Changelog Plugin to generate compare/links.
pluginRepositoryUrl = https://github.com/EverNife/everylibs-idea-plugin

# Opt-out flag for bundling the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
